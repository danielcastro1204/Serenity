serenity {
  project.name = "La Botica del Alquimista - HU-01"
  # Capturas solo en fallos: evidencia útil sin volver lenta la suite.
  # Para depurar se puede usar -Dserenity.take.screenshots=FOR_EACH_ACTION
  take.screenshots = FOR_FAILURES
  # Navegador nuevo por escenario: el estado de la tienda vive en localStorage,
  # así que cada escenario arranca con stock, carrito y cupón iniciales.
  restart.browser.for.each = scenario
  report.encoding = UTF8
  test.root = features
  requirements.dir = src/test/resources/features
  logging = VERBOSE
}

screenplay.pronouns = "él,ella,su,sus"

# Datos de prueba de la aplicación (HU-01). Se pueden sobrescribir con las variables
# de entorno BOTICA_USERNAME y BOTICA_PASSWORD (ver CustomerCredentials.java).
botica {
  username = "alquimista"
  password = "pocion123"
}

webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 0
    fluentwait = 10000
  }
  wait.for.timeout = 10000
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["--headless=new", "--window-size=1920,1080", "--no-sandbox",
              "--disable-dev-shm-usage", "--disable-gpu", "--remote-allow-origins=*",
              "--disable-notifications", "--disable-search-engine-choice-screen"]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://boticaalquimista.onrender.com"
  }
  # Ejecución con navegador visible: -Denvironment=visible
  visible {
    webdriver.base.url = "https://boticaalquimista.onrender.com"
    webdriver.capabilities."goog:chromeOptions".args = ["--window-size=1920,1080", "--remote-allow-origins=*"]
  }
}
